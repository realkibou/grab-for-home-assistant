- sensor:
    # Link Sharing
    - name: "Grab Link Route ETA"
      unique_id: grab_link_route_eta
      device_class: timestamp
      state: >
        {% set ts = state_attr('sensor.grab_link_booking', 'route_eta_unix') %}
        {% if ts %}
          {{ ts | int | timestamp_local }}
        {% else %}
          unknown
        {% endif %}
    
    - name: "Grab Link Driver Name"
      unique_id: grab_link_driver_name
      state: >
        {{ state_attr('sensor.grab_link_booking', 'driver_name') | default('Unknown', true) }}
    
    - name: "Grab Link Order From"
      unique_id: grab_link_order_from
      state: >
        {{ state_attr('sensor.grab_link_booking', 'pickup') | default('Unknown', true) }}
    
    - name: "Grab Link Order To"
      unique_id: grab_link_order_to
      state: >
        {{ state_attr('sensor.grab_link_booking', 'dropoff') | default('Unknown', true) }}
    
    - name: "Grab Link Driver Arrival"
      unique_id: grab_link_driver_arrival
      device_class: timestamp
      state: >
        {% set value = state_attr('sensor.grab_link_booking', 'driver_arrival_utc') %}
        {% if value %}
          {{ as_datetime(value) }}
        {% else %}
          unknown
        {% endif %}
    
    - name: "Grab Link Title"
      unique_id: grab_link_title
      state: >
        {{ state_attr('sensor.grab_link_booking', 'title') | default('', true) }}
        
    - name: "Grab Link Message"
      unique_id: grab_link_message
      state: >
        {{ state_attr('sensor.grab_link_booking', 'message') | default('', true) }}
    
    - name: "Grab Link Pending Delivery"
      unique_id: grab_link_pending_delivery
      state: >
        {{ state_attr('sensor.grab_link_booking', 'is_pending_delivery') | default(false, true) }}
        
- binary_sensor:
    - name: "Grab Link Driver Approaching"
      unique_id: grab_link_driver_approaching
      device_class: presence
      state: >
        {% set eta = state_attr('sensor.grab_link_booking', 'route_eta_unix') | int(0) %}
        {% if eta > 0 %}
          {% set seconds = eta - as_timestamp(now()) %}
          {{ seconds > 0 and seconds <= 300 }}
        {% else %}
          false
        {% endif %}